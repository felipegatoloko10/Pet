name: Pingo 2 — validar e empacotar
on:
  push:
    branches: [main, "codex/**"]
    tags: ["v2.*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pingo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build -w @pingo/mobile
      - run: npm run check -w @pingo/scheduler
      - name: Verificar cron e fila no runtime Workers/D1 local
        run: npm run test:scheduler
      - name: Verificar painel no navegador
        run: npx playwright test
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - name: Compilar instalador Windows
        run: npm run desktop -- build
        env:
          VITE_API_URL: https://pingo-gilt.vercel.app
      - name: Verificar instância única e fechamento nativo
        shell: pwsh
        run: ./scripts/verify-desktop.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pingo-Windows-diagnostico
          include-hidden-files: true
          path: |
            apps/desktop/src-tauri/target/release/pingo.exe
            .verification/native-shutdown.log
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: Pingo-Windows-instalador
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run mobile:build
      - name: Validar o código Android
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Preparar assinatura e configuração Android
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v2.')
        env:
          KEYSTORE: ${{ secrets.PINGO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pingo-release.jks"
      - name: Compilar APK assinado
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v2.')
        working-directory: apps/mobile/android
        env:
          PINGO_ANDROID_KEYSTORE: ${{ runner.temp }}/pingo-release.jks
          PINGO_ANDROID_STORE_PASSWORD: ${{ secrets.PINGO_ANDROID_STORE_PASSWORD }}
          PINGO_ANDROID_KEY_PASSWORD: ${{ secrets.PINGO_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Preparar arquivo e checksum
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v2.')
        run: |
          mkdir -p .verification/android-release
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk .verification/android-release/Pingo_2.6.0-beta.1_android.apk
          cd .verification/android-release
          sha256sum Pingo_2.6.0-beta.1_android.apk > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v2.')
        with:
          name: Pingo-Android-instalador
          path: .verification/android-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Pingo-Android-testes
          path: apps/mobile/android/app/build/reports/tests/
  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Pingo-*-instalador
          merge-multiple: true
          path: installers
      - name: Publicar instaladores Windows e Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease --notes-file docs/RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" installers/* --draft --prerelease --title "Pingo $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
          fi
