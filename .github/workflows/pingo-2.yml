name: Pingo 2 — validar e empacotar
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v2.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check -w @pingo/scheduler
      - run: npx playwright install --with-deps chromium
      - name: Verificar painel no navegador
        run: npx playwright test
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
      - name: Compilar instalador Windows
        run: npm run desktop -- build
        env:
          VITE_API_URL: https://pingo-feh-team.vercel.app
      - uses: actions/upload-artifact@v4
        with:
          name: Pingo-Windows-instalador
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publicar instalador no beta
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ./apps/desktop/src-tauri/target/release/bundle/nsis/*.exe --prerelease --title "Pingo $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
        # Release permission is scoped to this job below.
    permissions:
      contents: write
